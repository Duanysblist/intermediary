services:

  # ============================================================
  # PostgreSQL database
  # ============================================================
  intermediary-db:
    image: postgres:17.9
    container_name: intermediary-db
    environment:
      POSTGRES_DB: intermediary
      POSTGRES_USER: intermediary
      POSTGRES_PASSWORD: devpassword
    volumes:
      - intermediary-pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intermediary -d intermediary"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Spring Boot application
  # ============================================================
  intermediary-app:
    image: intermediary-app:latest
    container_name: intermediary-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      intermediary-db:
        condition: service_healthy

volumes:
  intermediary-pgdata:
    external: true