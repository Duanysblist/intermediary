spring:
  application:
    name: intermediary

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intermediary}"
    username: "${SPRING_DATASOURCE_USERNAME:intermediary}"
    password: "${SPRING_DATASOURCE_PASSWORD:devpassword}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: ${PORT:8080}