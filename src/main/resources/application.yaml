spring:
  application:
    name: intermediary

  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intermediary}"
    username: "${SPRING_DATASOURCE_USERNAME:intermediary}"
    password: "${SPRING_DATASOURCE_PASSWORD:devpassword}"
    driver-class-name: org.postgresql.Driver

  # Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it.
  flyway:
    enabled: true
    # Databases created before Flyway was introduced already have the V1 tables: mark them as baselined.
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Instants are stored as UTC regardless of the server clock, so timestamps mean the same thing everywhere.
        timezone.default_storage: NORMALIZE_UTC
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: ${PORT:8080}
  # Behind Render/Vercel proxies: trust X-Forwarded-* so generated links use https.
  forward-headers-strategy: framework

# Deployment settings. Defaults are for local development only; set the
# environment variables in production (see README "Deploying").
app:
  # Your local zone. Used for "today" on the server, e.g. which day a routine generates from.
  timezone: ${APP_TIMEZONE:America/New_York}
  auth:
    username: ${APP_USERNAME:dev}
    # Leave APP_PASSWORD unset and a random password is generated and printed in the log at startup.
    password: ${APP_PASSWORD:}
    # At least 32 bytes; generate with: openssl rand -base64 48. Unset = random per start (tokens die on restart).
    jwt-secret: ${APP_JWT_SECRET:}
    token-ttl-hours: ${APP_TOKEN_TTL_HOURS:72}
  cors:
    # Comma-separated list of browser origins allowed to call the API.
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,https://intermediary-frontend.vercel.app}
  ai:
    # Leave empty to disable POST /ai/suggest.
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${APP_AI_MODEL:claude-opus-5}
