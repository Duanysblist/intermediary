# Active inside the docker-compose stack (SPRING_PROFILES_ACTIVE=docker).
# Only the DB host differs; credentials come from the environment via application.yaml.
spring:
  datasource:
    url: jdbc:postgresql://intermediary-db:5432/intermediary

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
